[package]
name = "dot-envy"
version = "1.0.0"
edition = "2024"
rust-version = "1.89"
authors = ["Felipe Carvalho <contact@carvalinho.dev>"]
description = "A CLI tool to validate, edit and securely share environment variables."
license = "MIT"
readme = "README.md"
repository = "https://github.com/carvalinh0/envy"

[lib]
name = "dot_envy"
path = "src/lib.rs"

[[bin]]
name = "envy"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.11.1"
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
anyhow = "1.0.104"
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
cron = "0.17.0"
ed25519-dalek = "3.0.0"
flate2 = "1.1.10"
hkdf = "0.13.0"
hmac = "0.13.0"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"], optional = true }
rpassword = "7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.1"
sha3 = "0.12.0"
tar = "0.4.46"
ureq = { version = "3.4.2", features = ["platform-verifier"] }
url = "2.5.8"
uuid = { version = "1.27.0", features = ["v4"] }
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
zeroize = { version = "1", features = ["serde"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[build-dependencies]
serde_json = "1.0.151"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

# Argon2id is far too slow without optimisations, which would make every test that touches a
# protected environment take seconds.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[target.'cfg(target_os = "linux")'.dependencies]
axum = { version = "0.8.9", default-features = false, features = ["json", "tokio", "http1"], optional = true }
axum-server = { version = "0.9.2", features = ["tls-rustls-ring"], optional = true }
rusqlite = { version = "0.42.0", features = ["bundled"], optional = true }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal"], optional = true }

[features]
default = ["keyring"]
# The OS keyring. Builds without it (the server image) only offer the file and remote backends.
keyring = ["dep:keyring"]
# `envy serve`: the HTTP listener and the SQLite store. Linux only.
server = ["dep:axum", "dep:axum-server", "dep:rusqlite", "dep:tokio"]

[package.metadata.release]
publish = true
tag-message = "Release {{version}}"
