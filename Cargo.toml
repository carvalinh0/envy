[package]
name = "dot-envy"
version = "1.1.0"
edition = "2024"
rust-version = "1.89"
authors = ["Felipe Carvalho <contact@carvalinho.dev>"]
description = "A CLI tool to validate, edit and securely share environment variables."
license = "MIT"
readme = "README.md"
repository = "https://github.com/carvalinh0/envy"

[lib]
name = "dot_envy"
path = "src/lib.rs"

[[bin]]
name = "envy"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
cron = "0.17.0"
flate2 = "1.1.10"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
rpassword = "7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha3 = "0.12.0"
tar = "0.4.46"
ureq = { version = "3.4.2", features = ["platform-verifier"] }
url = "2.5.8"
uuid = { version = "1.27.0", features = ["v4"] }
zeroize = { version = "1", features = ["serde"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[build-dependencies]
serde_json = "1.0.151"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[package.metadata.release]
publish = true
tag-message = "Release {{version}}"
