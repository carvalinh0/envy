name: Bump Version, Tag and create release

# vMajor.Minor.Patch
# feat!: Major
# feat: Minor
# fix: Patch
# : Patch
#
# The tag is always created. The binaries, the server image, the crates.io publish and the
# GitHub release only happen when every test passes AND either:
#   - the change is Minor (feat:) or Major (feat!:), or
#   - the workflow was started manually (Actions -> run workflow, on main). A manual run
#     releases the tag of the current commit (the one created by the last push, if any).
# Patch changes (fix: or anything else) pushed to main just get a tag.

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Jobs only get a token that reads the repository, unless they ask for more below. Third-party
# actions are pinned to commits, so a moved tag can't change what runs with these tokens.
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Run unit and integration tests
        run: cargo test --all-targets

      # The SQLite store and the HTTP listener of `envy serve` only build with this feature
      # (Linux only); the default run above already covers the server rules in-process.
      - name: Lint and test the server build
        if: runner.os == 'Linux'
        run: |
          cargo clippy --all-targets --features server -- -D warnings
          cargo test --all-targets --features server

  tag:
    # No tag is created unless every test passes.
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
      release: ${{ github.event_name == 'workflow_dispatch' || steps.tag.outputs.part == 'minor' || steps.tag.outputs.part == 'major' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag
        uses: anothrNick/github-tag-action@c360518fb8131e99795f8208f8a6105ceca55ec2 # 1.64.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: true
          DEFAULT_BUMP: patch
          # The action looks for these strings in the commit messages (by default it only
          # knows #major and #minor). "feat!:" is checked first, so it is never taken as "feat:".
          MAJOR_STRING_TOKEN: "feat!:"
          MINOR_STRING_TOKEN: "feat:"

  build:
    needs: [test, tag]
    if: needs.tag.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: envy
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: envy.exe
            archive: zip
          # - os: macos-latest
          #   target: aarch64-apple-darwin
          #   bin: envy
          #   archive: tar.gz
          # - os: macos-latest
          #   target: x86_64-apple-darwin
          #   bin: envy
          #   archive: tar.gz
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}

      - name: Use the tag as the binary version
        env:
          TAG: ${{ needs.tag.outputs.new_tag }}
        run: |
          VERSION="${TAG#v}"
          sed -i.bak -e "1,/^version = /s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          rm -f Cargo.toml.bak
          grep -m1 '^version' Cargo.toml

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        env:
          TAG: ${{ needs.tag.outputs.new_tag }}
        run: |
          NAME="envy-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/$NAME"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/$NAME/"
          cp README.md "dist/$NAME/"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "$NAME.zip" "$NAME"
          else
            tar -czf "$NAME.tar.gz" "$NAME"
          fi
          rm -rf "$NAME"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: envy-${{ matrix.target }}
          path: dist/*

  publish:
    needs: [test, tag]
    if: needs.tag.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Use the tag as the crate version
        env:
          TAG: ${{ needs.tag.outputs.new_tag }}
        run: |
          VERSION="${TAG#v}"
          sed -i "0,/^version = \".*\"/s//version = \"$VERSION\"/" Cargo.toml
          grep -m1 '^version' Cargo.toml

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --allow-dirty

  docker:
    # The server image (ADR 0002): built from the Dockerfile, which runs the tests of the
    # server build first, and pushed to the GitHub Container Registry. The third-party
    # actions are pinned to commits: they receive a token that can publish packages.
    needs: [test, tag]
    if: needs.tag.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the server image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          build-args: VERSION=${{ needs.tag.outputs.new_tag }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.tag.outputs.new_tag }}
            ghcr.io/${{ github.repository }}:latest

  release:
    needs: [test, tag, build]
    if: needs.tag.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.tag.outputs.new_tag }}
        run: gh release create "$TAG" dist/* --title "$TAG" --generate-notes --verify-tag